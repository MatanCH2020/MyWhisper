name: Windows stability
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the pinned CPU dependency set in a clean environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify clean installation without downloading a model
        run: .\.venv\Scripts\python scripts\verify_install.py
      - name: Regression tests
        run: .\.venv\Scripts\python -m unittest discover tests
      - name: Verify release information and version bump
        run: .\.venv\Scripts\python scripts\sync_release.py --check
